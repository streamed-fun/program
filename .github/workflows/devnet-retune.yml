# Retunes the program's Global settings on devnet. Manual trigger only.
#
# The graduation bars are exposed because they are the settings a test network
# wants different from production: a bar a few wallets can reach lets every
# state of a coin be exercised. The oracle set is exposed because the claim
# flow cannot work without three DISTINCT keys in the three slots — a Global
# initialized from a single ORACLE_ADDRESSES entry puts one key in all three,
# which meets no threshold above one and refuses every claim. Everything else
# in Global is read from the chain and carried forward unchanged (see
# scripts/init-global.mjs).
#
# ⚠️ Changing the oracle set increments `oracle_epoch`, which cancels every
# claim that is mid-timelock. That is deliberate (spec §3.4) and it applies to
# a routine rotation exactly as it does to an incident. Claimants re-initiate
# with a fresh attestation; nothing is lost but the wait.
#
# ⭐ Only PUBLIC oracle addresses are passed here. The signing halves belong
# wherever the oracle service keeps them and never reach this workflow.
#
# ⛔ EVERY INPUT IS OPTIONAL AND BLANK MEANS "LEAVE IT ALONE". The graduation
# bars used to be required with devnet defaults filled in, so a run that only
# meant to rotate the oracle set would also have quietly moved the bars from
# whatever was on chain to 1 / 0.85. `update_global` takes the whole parameter
# set, which makes every unmentioned field a silent write unless something
# carries it forward — scripts/init-global.mjs reads the live Global and does
# exactly that.
#
# Required repo secret:
#   DEVNET_DEPLOYER_KEYPAIR - the keypair that initialized Global; it is
#                             Global.authority and the only key update_global
#                             accepts.
#
# The script takes the keypair as a file path, so the secret is written to the
# runner's private temp directory with owner-only permissions and removed in a
# step that runs whether or not the retune succeeded.

name: Retune Global on devnet

on:
  workflow_dispatch:
    inputs:
      grad_bar:
        description: 'Graduation bar in SOL collected (new coins only). Blank keeps the current value.'
        required: false
        default: ''
      grad_bar_claimed:
        description: 'Graduation bar once the streamer has claimed, in SOL (must not exceed grad_bar). Blank keeps the current value.'
        required: false
        default: ''
      oracles:
        description: 'Three DISTINCT oracle addresses, comma separated. Leave blank to keep the current set. Rotating them cancels every pending claim.'
        required: false
        default: ''
      claim_delay_seconds:
        description: 'Veto window in seconds. Blank keeps the current value. The program floors it at 86400 (24h), which is also the fastest an end-to-end claim test can run.'
        required: false
        default: ''
      dry_run:
        description: 'Print what would change and send nothing'
        type: boolean
        default: false

jobs:
  retune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stage the authority key
        if: ${{ !inputs.dry_run }}
        env:
          DEVNET_DEPLOYER_KEYPAIR: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR }}
        run: |
          test -n "$DEVNET_DEPLOYER_KEYPAIR" || { echo "DEVNET_DEPLOYER_KEYPAIR secret is not set"; exit 1; }
          (umask 077; printf '%s' "$DEVNET_DEPLOYER_KEYPAIR" > "$RUNNER_TEMP/deployer.json")
      - name: Retune
        env:
          DEVNET_DEPLOYER_KEYPAIR: ${{ runner.temp }}/deployer.json
          GRAD_BAR: ${{ inputs.grad_bar }}
          GRAD_BAR_CLAIMED: ${{ inputs.grad_bar_claimed }}
          ORACLES: ${{ inputs.oracles }}
          CLAIM_DELAY: ${{ inputs.claim_delay_seconds }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -- --update
          if [ -n "$GRAD_BAR" ]; then set -- "$@" --grad-bar "$GRAD_BAR"; fi
          if [ -n "$GRAD_BAR_CLAIMED" ]; then set -- "$@" --grad-bar-claimed "$GRAD_BAR_CLAIMED"; fi
          if [ -n "$ORACLES" ]; then set -- "$@" --oracles "$ORACLES"; fi
          if [ -n "$CLAIM_DELAY" ]; then set -- "$@" --claim-delay "$CLAIM_DELAY"; fi
          if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          node scripts/init-global.mjs "$@"
      - name: Remove the staged key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/deployer.json"
